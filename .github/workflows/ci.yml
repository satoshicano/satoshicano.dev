name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.3.0
        with:
          hugo-version: latest
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.0"

      - name: Build site
        run: hugo

      - name: Verify build output
        run: |
          if [ ! -d "public" ]; then
            echo "Error: public directory not created"
            exit 1
          fi
          if [ ! -f "public/index.html" ]; then
            echo "Error: index.html not created"
            exit 1
          fi
          echo "Build successful! Generated files in public/"
