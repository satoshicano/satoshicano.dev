name: Verify Actions Lockfile

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify workflow dependencies
        run: gh actions-lock --verify
